[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "makeup-refine"
version = "0.1.0"
description = "Image-first makeup enhancement and evidence-based instructions"
requires-python = ">=3.9"
dependencies = ["Pillow>=10,<12", "pillow-heif>=0.22,<1; python_version < '3.10'", "pillow-heif>=1.7,<2; python_version >= '3.10'", "numpy>=1.24,<3", "pydantic>=2.8,<3", "httpx>=0.27,<1", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
landmarks = ["mediapipe>=0.10.21,<0.11"]
dev = ["pytest>=8,<9"]

[project.scripts]
makeup-refine = "makeup_refine.cli:main"
makeup-recompose = "makeup_refine.recompose_cli:main"
makeup-refine-legacy = "makeup_refine.legacy_cli:main"
makeup-check = "makeup_refine.check_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
makeup_refine = ["technique_mapping_table.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
